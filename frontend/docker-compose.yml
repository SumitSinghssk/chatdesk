name: starter-kit-frontend

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${API_INTERNAL_URL:-http://api:8001}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    image: starter-kit-frontend:latest
    restart: unless-stopped
    environment:
      ADMIN_HINT_SECRET: ${ADMIN_HINT_SECRET:?Set ADMIN_HINT_SECRET in .env.docker}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks: [starter-kit]

networks:
  starter-kit:
    name: starter-kit
    external: true
